# Render blueprint — one Node service that serves the API on a single URL.
# Handles every op the extension needs: generate / explain / hint (LLM via the
# Adaption key) and run (node:vm executes the generated reference + user code).
# The API key + guardrail token live ONLY here as env vars (never in the repo
# or the extension).
# 1. Push this repo to GitHub, then Render -> "New Web Service" -> Free.
# 2. Set env vars (shown below); the server reads them from the environment.
services:
  - type: web
    name: counterexample-finder
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    envVars:
      - key: BHARATCODE_API_KEY
        value: your_adaption_pt_live_key_here
        sync: false
      - key: BHARATCODE_MODEL
        value: qwen3.8-27b
      - key: BHARATCODE_BASE_URL
        value: https://api.prod.adaptionlabs.ai/api/v1
      - key: CXF_TOKEN
        value: cef7f3a92d41b8e65c0a9347d2e8f160
        sync: false
