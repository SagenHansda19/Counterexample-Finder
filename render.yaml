# Render blueprint — one service that serves the built app AND the API on a single URL.
# Deploys the Express server (:4000), which serves app/dist + /api/analyze + /api/explain.
# 1. Push this repo to GitHub, then "New Web Service -> Free".
# 2. Set these env vars in Render (matching server reads them via .env):
#    BHARATCODE_API_KEY   = your key (Adaption pt_live_... or your BharatCode key)
#    BHARATCODE_MODEL    = qwen3.8-27b
#    BHARATCODE_BASE_URL  = https://api.prod.adaptionlabs.ai/api/v1
services:
  - type: web
    name: counterexample-finder
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    envVars:
      - key: BHARATCODE_API_KEY
        value: your_key_here
      - key: BHARATCODE_MODEL
        value: qwen3.8-27b
      - key: BHARATCODE_BASE_URL
        value: https://api.prod.adaptionlabs.ai/api/v1
        sync: false
